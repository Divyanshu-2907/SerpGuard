name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint the workflows
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

      - name: Shellcheck the composite action's shell
        run: |
          # actionlint reads workflows, not action.yml, so the action's own
          # scripts are pulled out and checked here. shellcheck is preinstalled
          # on GitHub runners.
          mkdir -p tmp/action-shell
          python3 - <<'PY'
          import io, os, re

          lines = io.open("action.yml", encoding="utf-8").read().split("\n")
          blocks, current = [], None

          for line in lines:
              if current is not None:
                  if line.strip() and not line.startswith(" " * current["indent"]):
                      blocks.append(current)
                      current = None
                  else:
                      current["lines"].append(line[current["indent"]:] if line.strip() else "")
                      continue
              match = re.match(r"^(\s*)run: \|\s*$", line)
              if match:
                  current = {"indent": len(match.group(1)) + 2, "lines": []}

          if current is not None:
              blocks.append(current)

          for index, block in enumerate(blocks, 1):
              path = os.path.join("tmp/action-shell", f"run_{index}.sh")
              io.open(path, "w", encoding="utf-8", newline="\n").write(
                  "#!/usr/bin/env bash\n" + "\n".join(block["lines"]).rstrip() + "\n"
              )
          print(f"extracted {len(blocks)} run block(s)")
          PY
          shellcheck --shell=bash --severity=style tmp/action-shell/*.sh

  test:
    runs-on: ubuntu-latest

    # The suite talks to a real MongoDB on purpose: the cache behaviour it covers
    # - a unique index, a hash lookup, a second request served from a stored row -
    # is exactly what a stubbed datastore would fail to prove. Everything else is
    # stubbed; WebMock blocks all outbound HTTP, so no API key is needed here.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run the spec suite
        env:
          RAILS_ENV: test
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/serpguard_test
        run: bundle exec rspec
