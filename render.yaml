# Render blueprint. Deploy with: New → Blueprint, pointed at this repo.
#
# Same shape as the sibling MiniSERP service: Ruby runtime, no asset pipeline,
# Puma reading config/puma.rb, secrets set in the dashboard rather than here.
services:
  - type: web
    name: serpguard
    runtime: ruby
    plan: free

    # Explicitly just `bundle install`. Render's dashboard pre-fills a build
    # command containing `rake assets:precompile`, which does not exist in an
    # API-only app and aborts the build. Setting it here avoids that entirely.
    buildCommand: bundle install
    startCommand: bundle exec puma -C config/puma.rb

    # GET /api/v1/health is unauthenticated and deliberately probes nothing - no
    # MongoDB, no Anthropic, no SerpApi - so Render's checks never fail because a
    # third party is slow. That is the whole reason it exists.
    healthCheckPath: /api/v1/health

    # The unique index on Claim#claim_hash is declared in the model but not
    # created by it. Run this once against the production URI (see README →
    # Deployment); Render's preDeployCommand is not available on the free plan:
    #
    # preDeployCommand: bundle exec rails db:mongoid:create_indexes

    envVars:
      - key: RAILS_ENV
        value: production

      # One Puma worker on a 512MB free instance: each worker loads the whole
      # app. Rack::Attack's counters live in Rails.cache, which is a FileStore
      # here, so limits are per-instance either way.
      - key: WEB_CONCURRENCY
        value: 1

      # Secrets: `sync: false` means Render prompts for these instead of reading
      # them from this file. Never commit their values.
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SERPGUARD_API_KEYS
        sync: false

      # Required, and not optional as it might look. Rails resolves
      # secret_key_base from the encrypted credentials, which need
      # config/master.key - a file that is gitignored and so does not exist on
      # the build host. Without one of these, anything that touches
      # secret_key_base raises ArgumentError: Missing `secret_key_base` for
      # 'production'.
      #
      # Render generates this on the first deploy, so nothing has to be pasted
      # in, and the master key never leaves the machine that made it. That key
      # would decrypt every credential forever; this value is scoped to signing
      # and can be rotated by deleting it here.
      - key: SECRET_KEY_BASE
        generateValue: true
