# Accuracy benchmark dataset for `rake eval:run`.
#
# 25 claims with a known answer. Every `expected` label was checked against the
# `label_source` URL before this file was written - these are not recalled from
# memory, and anything that could not be sourced is not in here.
#
# Rules the set follows:
#   - Clear and checkable. No opinions, no disputed facts, no trick wording.
#   - None of the three demo presets, or any claim from them, appears here.
#   - For an invented method, the label source is the canonical method list for
#     that class: it proves the absence, which is the thing being claimed.
#
# `expected` is what a correct verifier should answer. "unconfirmed" is never an
# expected value: it is an abstention, counted separately by the runner.
#
# Categories: true_fact, false_fact, real_method, invented_method, time_sensitive

