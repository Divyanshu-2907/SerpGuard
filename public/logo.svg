<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 72" width="268" height="72"
     role="img" aria-label="SerpGuard">
  <title>SerpGuard</title>
  <!--
    Shield and wordmark, for light backgrounds. Same geometry as
    logo-mark.svg, scaled to 56 units and set beside the name.

    Colours are the page's own: #0B6B75 is the accent token in the light
    theme and #14151A is its text colour. The wordmark is live text in the page's font stack
    rather than outlines, so it stays selectable and weighs almost nothing.
  -->
  <g transform="translate(8 8) scale(0.875)">
    <path fill="#0B6B75" fill-rule="evenodd" d="
      M32 4 L57 13 V33 C57 46.5 46.6 56.4 32 60 C17.4 56.4 7 46.5 7 33 V13 Z
      M32 12.6 L49 18.7 V33 C49 42.6 42 50 32 53.1 C22 50 15 42.6 15 33 V18.7 Z
    "/>
    <path fill="none" stroke="#0B6B75" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          d="M23 33.2 L29.4 39.6 L42 27"/>
  </g>

  <text x="76" y="48" font-size="38" font-weight="700" letter-spacing="-0.8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <tspan fill="#14151A">Serp</tspan><tspan fill="#0B6B75">Guard</tspan>
  </text>
</svg>
